<!doctype html>
<html lang="ar">
<head>
<script src="./assets-embed.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>AI MAN</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1430;color:#fff;touch-action:none;overscroll-behavior:none;
  font-family:Tajawal,"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hide{display:none!important}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-weight:900}
svg{display:block}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .35s}
#hud.on{opacity:1}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));display:flex;align-items:flex-start;gap:10px;direction:ltr}
#btns{display:flex;gap:6px;pointer-events:auto}
.hb{width:42px;height:42px;border-radius:14px;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(30,18,60,.55));box-shadow:0 3px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hb svg{width:22px;height:22px}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding-top:4px}
#prog{position:relative;width:calc(100% - 22px);max-width:360px;margin-right:14px;height:12px;border-radius:8px;background:rgba(20,10,40,.45);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 0 1.5px rgba(255,255,255,.35)}
#progF{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:8px;background:linear-gradient(90deg,#3de0ff,#8f7bff 60%,#ffd36b)}
.tick{position:absolute;top:-3px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:rgba(255,255,255,.55)}
.tick.ok{background:#56f0a0;box-shadow:0 0 8px #56f0a0}
#progHero{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9fe8ff,#2a7bff);box-shadow:0 0 0 2px #fff,0 0 10px #3de0ff}
#progBook{position:absolute;right:-14px;top:50%;width:26px;height:26px;margin-top:-13px}
#robotBadge{display:flex;align-items:center;gap:4px;opacity:0;transform:scale(.6);transition:all .25s}
#robotBadge.on{opacity:1;transform:scale(1)}
#robotBadge svg{width:30px;height:30px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
#robotBadge i{display:block;width:70px;height:8px;border-radius:5px;background:rgba(0,0,0,.4);overflow:hidden}
#robotBadge i b{display:block;height:100%;width:50%;background:linear-gradient(90deg,#ff4d4d,#ffb347)}
#stats{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#score{min-width:64px;text-align:right;font-size:30px;line-height:1;color:#fff;text-shadow:0 2px 0 #c2410c,0 4px 12px rgba(0,0,0,.45)}
.pill{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 5px;border-radius:14px;font-size:17px;background:rgba(25,12,50,.42);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}
.pill svg{width:20px;height:20px}
#combo{font-size:20px;color:#ffd36b;text-shadow:0 2px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#combo.on{opacity:1}
.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.25)}}
@media (max-width:480px){#score{font-size:24px;min-width:52px}.pill{font-size:15px;padding:2px 8px 2px 4px}.pill svg{width:17px;height:17px}.hb{width:38px;height:38px}#topbar{gap:8px}}

#hint{position:absolute;left:50%;top:30%;width:84px;height:84px;margin:-42px 0 0 -42px;opacity:0;transition:opacity .2s;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55))}
#hint.on{opacity:1}
#hint svg{width:84px;height:84px}
#hint.up svg{animation:hu .6s ease-in-out infinite alternate}
#hint.down svg{animation:hd .6s ease-in-out infinite alternate}
#hint.left svg{animation:hl .6s ease-in-out infinite alternate}
#hint.right svg{animation:hr .6s ease-in-out infinite alternate}
#hint.warn svg{animation:hw .3s ease-in-out infinite alternate}
@keyframes hu{to{transform:translateY(-16px)}}@keyframes hd{to{transform:translateY(16px)}}
@keyframes hl{to{transform:translateX(-18px)}}@keyframes hr{to{transform:translateX(18px)}}
@keyframes hw{to{transform:scale(1.12)}}

#speed{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,0) 0deg 3.2deg,rgba(255,250,235,.4) 3.4deg 3.7deg,rgba(255,255,255,0) 3.9deg 7.1deg);
  -webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 34%,#000 80%);mask-image:radial-gradient(ellipse at 50% 46%,transparent 34%,#000 80%)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;background:radial-gradient(ellipse at center,rgba(255,255,255,0) 35%,rgba(255,60,60,.6))}
#white{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:#fff7e8}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(40,10,30,.38))}

/* ---------- cover ---------- */
#cover{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(26px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(30,12,60,.55) 0%,rgba(30,12,60,0) 34%,rgba(30,12,60,0) 58%,rgba(20,8,40,.75) 100%);transition:opacity .5s}
#cover.gone{opacity:0;pointer-events:none}
#title{margin:0;direction:ltr;text-align:center;line-height:.9;font-family:"Arial Black","Segoe UI Black",Impact,system-ui,sans-serif;font-weight:900;
  font-size:clamp(56px,15vw,120px);letter-spacing:.02em;color:#fff;
  background:linear-gradient(180deg,#ffffff 0%,#fff3c4 45%,#ffb347 52%,#ff7a3d 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 0 #3a1460) drop-shadow(0 10px 22px rgba(0,0,0,.45));animation:tbob 3s ease-in-out infinite}
#title small{display:block;height:6px;margin:10px auto 0;width:58%;border-radius:4px;background:linear-gradient(90deg,transparent,#3de0ff,transparent)}
@keyframes tbob{50%{transform:translateY(-6px)}}
#coverBot{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
#load{display:flex;align-items:center;gap:10px;direction:ltr}
#loadBar{width:min(60vw,260px);height:10px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
#loadF{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#3de0ff,#ffd36b);transition:width .15s}
#loadP{font-size:15px;min-width:44px;text-align:left;color:#ffe9b8}
#play{width:min(80vw,300px);height:76px;border:0;border-radius:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#ffd36b,#ff8a3d);box-shadow:0 7px 0 #b4471b,0 12px 30px rgba(255,140,60,.5);transition:transform .1s;animation:pulse 1.6s ease-in-out infinite}
#play:active{transform:translateY(4px);box-shadow:0 3px 0 #b4471b}
#play svg{width:44px;height:44px}
#play:disabled{filter:grayscale(.8) brightness(.8);animation:none;cursor:default}
@keyframes pulse{50%{transform:scale(1.05)}}
#ctrlIcons{display:flex;gap:14px;opacity:.85;direction:ltr}
#ctrlIcons svg{width:30px;height:30px}

/* ---------- pause ---------- */
.modal{position:fixed;inset:0;z-index:7;display:none;align-items:center;justify-content:center;background:rgba(20,8,40,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal.on{display:flex}
.mcard{display:flex;gap:14px;padding:18px;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(40,20,80,.6));box-shadow:0 10px 40px rgba(0,0,0,.4),inset 0 0 0 1.5px rgba(255,255,255,.35)}
.bigb{width:76px;height:76px;border-radius:24px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#5ee8ff,#2a7bff);box-shadow:0 5px 0 #1b4aa8}
.bigb.o{background:linear-gradient(180deg,#ffd36b,#ff8a3d);box-shadow:0 5px 0 #b4471b}
.bigb svg{width:38px;height:38px}

/* ---------- final ---------- */
#final{position:fixed;inset:0;z-index:7;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;
  padding:16px 16px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(20,8,40,0) 45%,rgba(20,8,40,.8) 100%)}
#final.on{display:flex;animation:fin .6s ease-out}
@keyframes fin{from{opacity:0;transform:translateY(30px)}}
#fStats{display:flex;gap:10px;direction:ltr}
#fStats .pill{font-size:22px;padding:6px 14px 6px 8px}
#fStats .pill svg{width:26px;height:26px}
#fScore{font-size:46px;text-shadow:0 3px 0 #c2410c,0 6px 18px rgba(0,0,0,.5)}
#fStars{display:flex;gap:6px}
#fStars svg{width:44px;height:44px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4));transform:scale(0);animation:star .4s ease-out forwards}
@keyframes star{to{transform:scale(1)}}
#bookCard{width:120px;height:160px;border-radius:6px 14px 14px 6px;position:relative;animation:float 2.6s ease-in-out infinite;
  background:linear-gradient(135deg,#2a3bd6,#6a2bd6 60%,#2a1470);box-shadow:inset 9px 0 0 rgba(0,0,0,.28),inset 0 0 0 3px #ffd36b,0 0 40px rgba(255,200,90,.55),0 14px 30px rgba(0,0,0,.4)}
#bookCard svg{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-40px 0 0 -30px}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
#bookBtn{display:flex;align-items:center;justify-content:center;gap:12px;width:min(88vw,380px);padding:18px 14px;border-radius:22px;text-align:center;text-decoration:none;cursor:pointer;
  font-size:26px;font-weight:900;color:#3a1600;direction:rtl;
  background:linear-gradient(180deg,#fff0a8,#ffb347 55%,#ff8a3d);box-shadow:0 7px 0 #b4471b,0 0 36px rgba(255,190,80,.65);animation:pulse 1.6s ease-in-out infinite}
#bookBtn svg{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
#againBtn{width:60px;height:60px;border-radius:20px}
#againBtn svg{width:30px;height:30px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="vig"></div>
<div id="speed"></div>
<div id="flash"></div>

<div id="hud">
  <div id="topbar">
    <div id="btns">
      <button class="hb" id="pauseBtn" type="button" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.2" height="14" rx="1.4" fill="#fff"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4" fill="#fff"/></svg></button>
      <button class="hb" id="muteBtn" type="button" aria-label="sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l6-4.5v15L8 15H4z" fill="#fff"/><path id="muteWaves" d="M16.5 9c1 .9 1.5 2 1.5 3s-.5 2.1-1.5 3M19 6.5c1.7 1.5 2.6 3.4 2.6 5.5s-.9 4-2.6 5.5" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/><path id="muteX" d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#ff8a8a" stroke-width="2.2" stroke-linecap="round" style="display:none"/></svg></button>
    </div>
    <div id="mid">
      <div id="prog"><div id="progF"></div><div id="progHero"></div>
        <svg id="progBook" viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2" fill="#4a3bd6" stroke="#ffd36b" stroke-width="1.8"/><path d="M8 7h8M8 10.5h6" stroke="#ffe9b8" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div id="robotBadge"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="10" rx="3" fill="#ffb347"/><rect x="7.5" y="7" width="3" height="3" rx="1" fill="#2b1a10"/><rect x="13.5" y="7" width="3" height="3" rx="1" fill="#2b1a10"/><rect x="11" y="1" width="2" height="3" fill="#ffb347"/><rect x="7" y="15" width="10" height="7" rx="2" fill="#c76a1e"/></svg><i><b id="robotGap"></b></i></div>
    </div>
    <div id="stats">
      <div id="score" class="num">0</div>
      <div class="pill" id="cardP"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.4" fill="#2ee6ff" stroke="#d8fbff" stroke-width="1.4"/><path d="M8.5 7.5h7M8.5 11h5M8.5 14.5h6" stroke="#06485a" stroke-width="1.6" stroke-linecap="round"/></svg><span id="cardV" class="num">0</span></div>
      <div class="pill" id="ramP"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="10" rx="1.2" fill="#2fd16a" stroke="#d6ffe3" stroke-width="1.2"/><rect x="5" y="8" width="4" height="5" fill="#123d22"/><rect x="10" y="8" width="4" height="5" fill="#123d22"/><rect x="15" y="8" width="4" height="5" fill="#123d22"/><path d="M5 16v3M8 16v3M11 16v3M14 16v3M17 16v3M20 16v3" stroke="#ffd36b" stroke-width="1.4"/></svg><span id="ramV" class="num">0</span></div>
      <div id="combo" class="num">x2</div>
    </div>
  </div>
  <div id="hint"></div>
</div>

<div id="white"></div>

<div id="cover">
  <h1 id="title">AI MAN<small></small></h1>
  <div id="coverBot">
    <div id="load"><div id="loadBar"><div id="loadF"></div></div><span id="loadP" class="num">0%</span></div>
    <button id="play" type="button" aria-label="play" disabled><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
    <div id="ctrlIcons" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4 12h16M8 8l-4 4 4 4M16 8l4 4-4 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 20V4M7 9l5-5 5 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 24 24"><path d="M12 4v16M7 15l5 5 5-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<div class="modal" id="pauseM"><div class="mcard">
  <button class="bigb o" id="resumeBtn" type="button" aria-label="resume"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff"/></svg></button>
  <button class="bigb" id="restartBtn" type="button" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div></div>

<div id="final">
  <div id="fStars"></div>
  <div id="fScore" class="num">0</div>
  <div id="fStats">
    <div class="pill"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.4" fill="#2ee6ff" stroke="#d8fbff" stroke-width="1.4"/><path d="M8.5 7.5h7M8.5 11h5M8.5 14.5h6" stroke="#06485a" stroke-width="1.6" stroke-linecap="round"/></svg><span id="fCards" class="num">0</span></div>
    <div class="pill"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="10" rx="1.2" fill="#2fd16a" stroke="#d6ffe3" stroke-width="1.2"/><rect x="5" y="8" width="4" height="5" fill="#123d22"/><rect x="10" y="8" width="4" height="5" fill="#123d22"/><rect x="15" y="8" width="4" height="5" fill="#123d22"/></svg><span id="fRam" class="num">0</span></div>
    <div class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="#ff6b6b"/><path d="M8 9.5l2 1.5M16 9.5l-2 1.5M8.5 16c2-1.6 5-1.6 7 0" stroke="#3a0d0d" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span id="fHits" class="num">0</span></div>
  </div>
    <a id="bookBtn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="2.5" width="16" height="19" rx="2" fill="#4a3bd6" stroke="#fff3c4" stroke-width="1.6"/><path d="M12 6.2l1.5 3.2 3.4.4-2.5 2.3.7 3.4-3.1-1.8-3.1 1.8.7-3.4-2.5-2.3 3.4-.4z" fill="#ffd36b"/></svg><span>احصل على الكتاب</span></a>
  <button class="bigb" id="againBtn" type="button" aria-label="replay"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>
<script type="module" src="./game.js"></script>
</body>
</html>
